<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" width="90" height="90">
  <defs>
    <!-- Can metallic gradient -->
    <linearGradient id="canMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="rimMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="beerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#38bdf8" flood-opacity="0.75"/>
    </filter>
  </defs>

  <g filter="url(#beerGlow)">
    <!-- Sparkles / Chill aura -->
    <circle cx="16" cy="22" r="2.5" fill="#38bdf8" />
    <circle cx="75" cy="18" r="3" fill="#facc15" />
    <circle cx="78" cy="68" r="2" fill="#38bdf8" />
    <circle cx="12" cy="62" r="2" fill="#facc15" />

    <!-- Can Top Rim Outer -->
    <ellipse cx="45" cy="22" rx="20" ry="6" fill="url(#rimMetal)" stroke="#334155" stroke-width="1.5" />
    <!-- Can Top Rim Inner Recess -->
    <ellipse cx="45" cy="22" rx="16" ry="4.5" fill="#cbd5e1" stroke="#475569" stroke-width="1" />
    <!-- Pull Tab -->
    <ellipse cx="47" cy="21.5" rx="5" ry="2" fill="#94a3b8" stroke="#334155" stroke-width="1" />
    <circle cx="43" cy="22" r="1.5" fill="#334155" />

    <!-- Can Main Cylinder Body -->
    <path d="M 25 22
             L 25 68
             C 25 76, 65 76, 65 68
             L 65 22
             Z"
          fill="url(#canMetal)" stroke="#0369a1" stroke-width="1.8" />

    <!-- Can Bottom Chime -->
    <path d="M 27 68 C 27 74, 63 74, 63 68" fill="none" stroke="url(#rimMetal)" stroke-width="2.5" />

    <!-- Specular Reflection Stripe down the can -->
    <path d="M 32 23 L 34 69" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.45" />

    <!-- Cold Condensation Drops -->
    <ellipse cx="37" cy="32" rx="1.5" ry="2" fill="#ffffff" opacity="0.8" />
    <ellipse cx="39" cy="48" rx="1.2" ry="1.8" fill="#ffffff" opacity="0.8" />
    <ellipse cx="35" cy="58" rx="1.5" ry="2" fill="#ffffff" opacity="0.8" />

    <!-- Beer Label Banner -->
    <rect x="25" y="34" width="40" height="22" fill="#f59e0b" stroke="#d97706" stroke-width="1" />
    <path d="M 25 36 L 65 36 M 25 54 L 65 54" stroke="#fef08a" stroke-width="1" />

    <!-- Beer Foam Wave graphic on label -->
    <path d="M 25 40 Q 35 37 45 40 Q 55 43 65 40" fill="none" stroke="#ffffff" stroke-width="1.5" />

    <!-- Label Text -->
    <text x="45" y="47" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="8" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      BEER
    </text>
    <text x="45" y="52" font-family="Arial, sans-serif" font-weight="bold" font-size="4" fill="#78350f" text-anchor="middle" letter-spacing="0.5">
      PREMIUM COLD
    </text>

    <!-- Star decoration -->
    <polygon points="45,28 46.5,31 50,31.5 47.5,33.5 48,37 45,35 42,37 42.5,33.5 40,31.5 43.5,31" fill="#fde047" />
  </g>
</svg>
