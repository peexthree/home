<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Jetpack flame gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="jetpackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#heroShadow)">
    <!-- Jetpack Thruster Flame -->
    <path d="M 28 76 Q 34 108 24 116 Q 42 102 44 76 Z" fill="url(#flameGrad)" />

    <!-- Jetpack Body -->
    <rect x="22" y="44" width="18" height="34" rx="7" fill="url(#jetpackGrad)" stroke="#0f172a" stroke-width="2" />
    <line x1="24" y1="55" x2="38" y2="55" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="24" y1="63" x2="38" y2="63" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="26" y="75" width="10" height="5" rx="2" fill="#1e293b" />

    <!-- Body / Dark Blue Casual Hoodie -->
    <ellipse cx="62" cy="72" rx="25" ry="21" fill="url(#hoodieGrad)" stroke="#1d4ed8" stroke-width="2" />
    <!-- Hoodie Strings / Zipper -->
    <path d="M 57 58 L 57 70 M 67 58 L 67 70" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />

    <!-- Flying Hand / Thumbs Up -->
    <circle cx="85" cy="65" r="7" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5" />
    <path d="M 87 60 Q 92 56 90 52 Q 86 52 86 58" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5" />

    <!-- Head / Face -->
    <ellipse cx="64" cy="44" rx="18" ry="19" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5" />

    <!-- Short Brown Hair (Visible at temple / back) -->
    <path d="M 46 44 C 45 32 54 26 65 26 C 75 26 83 31 83 40 C 81 37 76 36 71 36 C 60 36 52 38 46 44 Z" fill="#451a03" />

    <!-- Cool Cap (Black/Dark Slate Baseball Cap) -->
    <path d="M 47 36 C 49 23 79 23 81 36 Z" fill="url(#capGrad)" stroke="#0f172a" stroke-width="1.5" />
    <!-- Cap Visor turned slightly sideways / cool angle -->
    <path d="M 68 34 Q 92 32 94 38 Q 78 40 66 37 Z" fill="#1e293b" stroke="#0f172a" stroke-width="1.2" />
    <!-- Cap Button on top -->
    <circle cx="64" cy="24" r="2.5" fill="#475569" />

    <!-- Eyebrows -->
    <path d="M 52 39 Q 57 37 61 39" fill="none" stroke="#3e1a06" stroke-width="2" stroke-linecap="round" />
    <path d="M 67 39 Q 72 37 77 39" fill="none" stroke="#3e1a06" stroke-width="2" stroke-linecap="round" />

    <!-- Eyes (Warm, Friendly, Expressive) -->
    <ellipse cx="56" cy="43" rx="2.8" ry="3.2" fill="#292524" />
    <circle cx="57" cy="42" r="1.1" fill="#ffffff" />
    <ellipse cx="72" cy="43" rx="2.8" ry="3.2" fill="#292524" />
    <circle cx="73" cy="42" r="1.1" fill="#ffffff" />

    <!-- Nose -->
    <path d="M 63 43 L 65 47 L 62 48" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Full Neat Brown Beard and Mustache -->
    <!-- Beard covering jawline and chin -->
    <path d="M 47 45
             C 47 56, 50 63, 64 64
             C 78 63, 81 56, 81 45
             C 79 51, 75 58, 64 58
             C 53 58, 49 51, 47 45 Z"
          fill="#451a03" />
    <!-- Mustache -->
    <path d="M 54 50 Q 64 51 64 53 Q 64 51 74 50 Q 64 47 54 50 Z" fill="#381403" />
    <!-- Smile in Beard -->
    <path d="M 59 54 Q 64 57 69 54" fill="none" stroke="#fed7aa" stroke-width="1.5" stroke-linecap="round" />

    <!-- Cheek Blush (Joyful / Birthday celebration) -->
    <circle cx="50" cy="47" r="3" fill="#f87171" opacity="0.4" />
    <circle cx="78" cy="47" r="3" fill="#f87171" opacity="0.4" />
  </g>
</svg>
