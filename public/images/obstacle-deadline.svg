<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 90" width="130" height="90">
  <defs>
    <!-- Fire gradient -->
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Bug body gradient -->
    <linearGradient id="bugBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>

    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#ef4444" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#flameGlow)">
    <!-- Back flames -->
    <path d="M 25 70 Q 20 40 35 25 Q 40 45 50 30 Q 60 50 75 18 Q 85 45 95 28 Q 105 48 115 35 Q 110 65 100 70 Z" fill="url(#fireGrad)" opacity="0.85" />

    <!-- Bug legs -->
    <path d="M 38 48 L 22 36 M 38 56 L 18 56 M 38 64 L 22 74" stroke="#fca5a5" stroke-width="3" stroke-linecap="round" />
    <path d="M 92 48 L 108 36 M 92 56 L 112 56 M 92 64 L 108 74" stroke="#fca5a5" stroke-width="3" stroke-linecap="round" />

    <!-- Main Bug Shell (Deadline bug) -->
    <ellipse cx="65" cy="56" rx="32" ry="22" fill="url(#bugBody)" stroke="#fecaca" stroke-width="1.8" />

    <!-- Bug Head -->
    <ellipse cx="65" cy="38" rx="16" ry="12" fill="#991b1b" stroke="#fecaca" stroke-width="1.5" />

    <!-- Antennae with warning sparks -->
    <path d="M 58 28 Q 50 18 44 14" stroke="#f87171" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="44" cy="14" r="3" fill="#fef08a" />
    <path d="M 72 28 Q 80 18 86 14" stroke="#f87171" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="86" cy="14" r="3" fill="#fef08a" />

    <!-- Glowing evil/stressed eyes -->
    <ellipse cx="58" cy="36" rx="4" ry="5" fill="#fef08a" stroke="#ef4444" stroke-width="1" />
    <circle cx="58" cy="36" r="2" fill="#7f1d1d" />

    <ellipse cx="72" cy="36" rx="4" ry="5" fill="#fef08a" stroke="#ef4444" stroke-width="1" />
    <circle cx="72" cy="36" r="2" fill="#7f1d1d" />

    <!-- "DEADLINE" Warning Badge across back -->
    <rect x="42" y="50" width="46" height="15" rx="3" fill="#18181b" stroke="#f59e0b" stroke-width="1" />
    <text x="65" y="61" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="8" fill="#fef08a" text-anchor="middle" letter-spacing="1">
      DEADLINE!
    </text>

    <!-- Fire sparks around bug -->
    <circle cx="30" cy="24" r="2" fill="#fef08a" />
    <circle cx="102" cy="22" r="2.5" fill="#f97316" />
    <circle cx="68" cy="12" r="1.8" fill="#fef08a" />
  </g>
</svg>
