<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Jetpack flame gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="jetpackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Jetpack Thruster Flame -->
    <path d="M 32 75 Q 38 105 30 115 Q 44 100 46 75 Z" fill="url(#flameGrad)" />

    <!-- Jetpack Body -->
    <rect x="26" y="44" width="18" height="32" rx="6" fill="url(#jetpackGrad)" stroke="#1e293b" stroke-width="2.5" />
    <line x1="28" y1="54" x2="42" y2="54" stroke="#cbd5e1" stroke-width="2" />
    <line x1="28" y1="62" x2="42" y2="62" stroke="#cbd5e1" stroke-width="2" />
    <rect x="30" y="74" width="10" height="5" rx="2" fill="#334155" />

    <!-- Character Body / Blue Hoodie -->
    <ellipse cx="64" cy="68" rx="24" ry="22" fill="#2563eb" stroke="#1d4ed8" stroke-width="2.5" />
    <!-- Hoodie Strings / Collar -->
    <path d="M 58 52 Q 64 60 70 52" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />

    <!-- Head / Face -->
    <circle cx="64" cy="42" r="20" fill="#fed7aa" stroke="#ea580c" stroke-width="2" />

    <!-- Hair -->
    <path d="M 46 38 C 46 25 56 20 68 20 C 78 20 84 26 84 34 C 80 32 74 33 68 31 C 60 30 52 34 46 38 Z" fill="#451a03" />

    <!-- Sunglasses (Cool Birthday Hero Look) -->
    <rect x="52" y="36" width="12" height="9" rx="3" fill="#0f172a" />
    <rect x="68" y="36" width="12" height="9" rx="3" fill="#0f172a" />
    <line x1="64" y1="40" x2="68" y2="40" stroke="#0f172a" stroke-width="2" />
    <!-- Sunglasses Glare -->
    <line x1="54" y1="38" x2="61" y2="38" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="70" y1="38" x2="77" y2="38" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Smiling Mouth -->
    <path d="M 60 52 Q 65 57 70 52" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round" />

    <!-- Festive Party Cone Cap -->
    <polygon points="58,10 74,4 72,25 54,27" fill="url(#capGrad)" stroke="#f43f5e" stroke-width="1.5" />
    <!-- Cap stripes -->
    <line x1="56" y1="21" x2="72" y2="18" stroke="#fef08a" stroke-width="2" />
    <line x1="60" y1="14" x2="70" y2="11" stroke="#38bdf8" stroke-width="2" />
    <!-- Cap Pom-pom -->
    <circle cx="66" cy="7" r="4" fill="#fbbf24" stroke="#f59e0b" stroke-width="1" />

    <!-- Flying Hand / Thumbs Up -->
    <ellipse cx="85" cy="62" rx="7" ry="6" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5" />
    <circle cx="88" cy="56" r="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5" />
  </g>
</svg>
