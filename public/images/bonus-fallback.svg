<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" width="90" height="90">
  <defs>
    <!-- Cake gradients -->
    <linearGradient id="frosting" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="sponge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <filter id="cakeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#fbbf24" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#cakeGlow)">
    <!-- Sparkles / Aura -->
    <circle cx="16" cy="20" r="2.5" fill="#fde047" />
    <circle cx="75" cy="18" r="3" fill="#fde047" />
    <circle cx="80" cy="65" r="2" fill="#fde047" />
    <circle cx="10" cy="60" r="2" fill="#fde047" />

    <!-- Cake Plate -->
    <ellipse cx="45" cy="74" rx="34" ry="7" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />

    <!-- Cake Base / Sponge -->
    <path d="M 20 54 L 20 68 C 20 74, 70 74, 70 68 L 70 54 Z" fill="url(#sponge)" stroke="#ca8a04" stroke-width="2" />

    <!-- Cake Frosting Layer -->
    <path d="M 20 52 C 20 52, 26 58, 30 52 C 34 48, 40 58, 45 52 C 50 48, 56 58, 60 52 C 65 48, 70 54, 70 52 L 70 42 C 70 38, 20 38, 20 42 Z" fill="url(#frosting)" stroke="#db2777" stroke-width="2" />

    <!-- Top Frosting Ellipse -->
    <ellipse cx="45" cy="42" rx="25" ry="7" fill="#fbcfe8" stroke="#db2777" stroke-width="1.5" />

    <!-- Candle 1 -->
    <rect x="36" y="24" width="4" height="15" rx="1.5" fill="#38bdf8" stroke="#0284c7" stroke-width="1" />
    <polygon points="38,15 35,22 41,22" fill="#f97316" />
    <circle cx="38" cy="19" r="2" fill="#fde047" />

    <!-- Candle 2 (Middle) -->
    <rect x="43" y="20" width="4" height="19" rx="1.5" fill="#a855f7" stroke="#7e22ce" stroke-width="1" />
    <polygon points="45,11 42,18 48,18" fill="#f97316" />
    <circle cx="45" cy="15" r="2" fill="#fde047" />

    <!-- Candle 3 -->
    <rect x="50" y="24" width="4" height="15" rx="1.5" fill="#38bdf8" stroke="#0284c7" stroke-width="1" />
    <polygon points="52,15 49,22 55,22" fill="#f97316" />
    <circle cx="52" cy="19" r="2" fill="#fde047" />

    <!-- Sprinkles -->
    <circle cx="32" cy="42" r="1.5" fill="#ef4444" />
    <circle cx="45" cy="44" r="1.5" fill="#3b82f6" />
    <circle cx="58" cy="41" r="1.5" fill="#22c55e" />
  </g>
</svg>
