<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 90" width="130" height="90">
  <defs>
    <!-- Alarm clock metal gradient -->
    <linearGradient id="alarmMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Bell bronze gradient -->
    <linearGradient id="bellMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <filter id="alarmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#alarmGlow)">
    <!-- Vibration / ring sound waves -->
    <path d="M 28 22 Q 22 28 24 38" stroke="#facc15" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 22 18 Q 14 26 16 42" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <path d="M 102 22 Q 108 28 106 38" stroke="#facc15" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 108 18 Q 116 26 114 42" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Left bell -->
    <path d="M 38 24 C 34 16, 46 8, 54 16 Z" fill="url(#bellMetal)" stroke="#713f12" stroke-width="1.5" />
    <!-- Right bell -->
    <path d="M 76 16 C 84 8, 96 16, 92 24 Z" fill="url(#bellMetal)" stroke="#713f12" stroke-width="1.5" />
    <!-- Top hammer -->
    <rect x="63" y="10" width="4" height="12" rx="2" fill="#94a3b8" />
    <circle cx="65" cy="10" r="4" fill="#64748b" />

    <!-- Clock feet -->
    <line x1="45" y1="72" x2="36" y2="82" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <line x1="85" y1="72" x2="94" y2="82" stroke="#475569" stroke-width="4" stroke-linecap="round" />

    <!-- Alarm Clock Body -->
    <circle cx="65" cy="48" r="28" fill="url(#alarmMetal)" stroke="#7f1d1d" stroke-width="2" />

    <!-- Clock Face -->
    <circle cx="65" cy="48" r="22" fill="#0f172a" stroke="#ffffff" stroke-width="1.5" />

    <!-- Red Digital 07:00 or Angry Clock Hands -->
    <text x="65" y="44" font-family="'Courier New', monospace" font-weight="900" font-size="8.5" fill="#ef4444" text-anchor="middle" letter-spacing="0.5">
      07:00
    </text>

    <!-- Angry eyebrows over clock face -->
    <path d="M 52 50 L 61 54" stroke="#f87171" stroke-width="2" stroke-linecap="round" />
    <path d="M 78 50 L 69 54" stroke="#f87171" stroke-width="2" stroke-linecap="round" />

    <!-- Angry red eyes -->
    <circle cx="56" cy="57" r="2.5" fill="#fef08a" />
    <circle cx="56" cy="57" r="1.2" fill="#dc2626" />
    <circle cx="74" cy="57" r="2.5" fill="#fef08a" />
    <circle cx="74" cy="57" r="1.2" fill="#dc2626" />

    <!-- Zig-zag angry mouth -->
    <path d="M 58 63 L 61 65 L 64 63 L 67 65 L 70 63 L 72 65" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" fill="none" />
  </g>
</svg>
