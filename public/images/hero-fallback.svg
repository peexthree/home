<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Jetpack flame gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="jetpackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <!-- Birthday Cone Cap Gradient matching reference photo (yellow & red diagonal stripes) -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="beardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#381907" />
      <stop offset="100%" stop-color="#241005" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Jetpack Thruster Flame -->
    <path d="M 28 75 Q 34 106 26 116 Q 40 101 42 75 Z" fill="url(#flameGrad)" />

    <!-- Jetpack Body -->
    <rect x="22" y="44" width="18" height="32" rx="6" fill="url(#jetpackGrad)" stroke="#1e293b" stroke-width="2.5" />
    <line x1="24" y1="54" x2="38" y2="54" stroke="#cbd5e1" stroke-width="2" />
    <line x1="24" y1="62" x2="38" y2="62" stroke="#cbd5e1" stroke-width="2" />
    <rect x="26" y="74" width="10" height="5" rx="2" fill="#334155" />

    <!-- Character Body / Party Hawaiian Shirt from photo -->
    <ellipse cx="62" cy="74" rx="24" ry="20" fill="#f59e0b" stroke="#b45309" stroke-width="2.5" />
    <!-- Shirt collar & pattern dots/flowers -->
    <path d="M 52 58 L 62 68 L 72 58" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="54" cy="74" r="2.5" fill="#38bdf8" />
    <circle cx="68" cy="78" r="2.5" fill="#ec4899" />
    <circle cx="62" cy="84" r="2" fill="#22c55e" />

    <!-- Head / Skin Tone -->
    <ellipse cx="62" cy="42" rx="19" ry="21" fill="#fcd34d" stroke="#d97706" stroke-width="1.5" />

    <!-- Ear -->
    <ellipse cx="43" cy="44" rx="3.5" ry="5.5" fill="#fcd34d" stroke="#d97706" stroke-width="1.5" />

    <!-- Hair (dark brown cropped on sides, styled on top as in reference) -->
    <path d="M 44 38 C 43 28 50 20 64 20 C 76 20 82 26 81 36 C 76 34 70 33 63 32 C 55 31 48 34 44 38 Z" fill="#29160a" />

    <!-- Distinctive Full Beard & Mustache matching photo -->
    <!-- Beard base wrapping chin and jaw -->
    <path d="M 44 42
             C 43 54 46 68 56 75
             C 62 79 70 78 74 72
             C 80 65 81 53 80 43
             C 76 49 73 54 62 55
             C 52 54 48 48 44 42 Z"
          fill="url(#beardGrad)" stroke="#1a0a03" stroke-width="1.5" />

    <!-- Beard Texture / Highlights -->
    <path d="M 54 66 Q 60 74 66 68" stroke="#5a2608" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 58 70 Q 64 76 68 71" stroke="#5a2608" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M 48 58 Q 54 67 60 69" stroke="#381907" stroke-width="1.5" fill="none" />

    <!-- Mustache -->
    <path d="M 51 49 C 55 45 61 46 62 48 C 64 46 70 45 74 49 C 70 52 64 52 62 50 C 60 52 55 52 51 49 Z" fill="#241005" />

    <!-- Open Happy Mouth / Teeth hint above beard -->
    <path d="M 58 48 Q 62 52 66 48" stroke="#991b1b" stroke-width="2" fill="#7f1d1d" stroke-linecap="round" />

    <!-- Sunglasses (Angular Party Shades from reference photo) -->
    <!-- Frame -->
    <rect x="49" y="34" width="12" height="10" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <rect x="65" y="34" width="12" height="10" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <!-- Bridge & temple -->
    <line x1="61" y1="38" x2="65" y2="38" stroke="#0f172a" stroke-width="2.5" />
    <line x1="44" y1="38" x2="49" y2="38" stroke="#0f172a" stroke-width="2.5" />
    <!-- Sunglasses Glare / Mirror reflection -->
    <line x1="51" y1="36" x2="58" y2="36" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="67" y1="36" x2="74" y2="36" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Festive Party Cone Cap matching the photo (Yellow & Red Striped) -->
    <polygon points="62,6 77,2 73,23 57,25" fill="#facc15" stroke="#dc2626" stroke-width="1.5" />
    <!-- Cap stripes (red diagonal stripes) -->
    <polygon points="60,20 64,18 73,20 71,23" fill="#dc2626" />
    <polygon points="64,13 69,11 75,13 74,16" fill="#dc2626" />
    <polygon points="69,6 74,4 77,5 76,8" fill="#dc2626" />
    <!-- Cap Pom-pom on top -->
    <circle cx="70" cy="5" r="3.5" fill="#facc15" stroke="#eab308" stroke-width="1" />

    <!-- Flying Hand / Thumbs Up -->
    <ellipse cx="86" cy="65" rx="7" ry="6" fill="#fcd34d" stroke="#d97706" stroke-width="1.5" />
    <circle cx="89" cy="59" r="3" fill="#fcd34d" stroke="#d97706" stroke-width="1.5" />
  </g>
</svg>
